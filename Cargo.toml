[package]
name = "sparky"
version = "0.2.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-ws = "0.4"
actix-multipart = "0.7"
awc = "3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
parking_lot = "0.12"
futures-util = "0.3"
actix-files = "0.6"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
argon2 = "0.5"
bytes = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
