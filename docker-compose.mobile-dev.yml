name: sparky_mobile_dev

x-build-args: &build-args
  HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
  ALL_PROXY: ${BUILD_ALL_PROXY:-}
  NO_PROXY: ${BUILD_NO_PROXY:-127.0.0.1,localhost,host.docker.internal}

x-runtime-env: &runtime-env
  PROJECT_CONFIG_DIR: /etc/sparky
  PROJECTS_ROOT: /projects
  CUSTOM_PROJECTS_FILE: /projects/.sparky/projects.json
  SSH_AUTH_SOCK: /ssh-agent
  SSH_KNOWN_HOSTS_TEMPLATE: /etc/sparky/known_hosts
  SANDBOX_ROOT: /tmp/sp-sandbox
  DATABASE_URL: ${MOBILE_DEV_DATABASE_URL:-}
  DB_MAX_CONNECTIONS: "5"
  SPARKY_BWRAP_UNSHARE_USER: "false"
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,host.docker.internal}

x-server-volumes: &server-volumes
  - ./config/projects.json:/etc/sparky/projects.json:ro
  - ./config/claude-user-state.json:/etc/sparky/claude-user-state.json:ro
  - ./config/claude-settings.json:/etc/sparky/claude-settings.json:ro
  - /root/.ssh/known_hosts:/etc/sparky/known_hosts.raw:ro
  - ${MOBILE_DEV_CODEX_HOME:-/tmp/sparky-mobile-dev/codex-config}:/home/app/.codex
  - ${HOST_SSH_AUTH_SOCK:-/run/user/0/gcr/ssh}:/ssh-agent
  - ${MOBILE_DEV_HOST_DATA_ROOT:-/tmp/sparky-mobile-dev}/projects:/projects

x-executor-volumes: &executor-volumes
  - ./config/projects.json:/etc/sparky/projects.json:ro
  - ./config/claude-user-state.json:/etc/sparky/claude-user-state.json:ro
  - ./config/claude-settings.json:/etc/sparky/claude-settings.json:ro
  - /root/.ssh/known_hosts:/etc/sparky/known_hosts.raw:ro
  - ${MOBILE_DEV_CODEX_HOME:-/tmp/sparky-mobile-dev/codex-config}:/home/app/.codex
  - ${MOBILE_DEV_HOST_DATA_ROOT:-/tmp/sparky-mobile-dev}/go:/home/app/go
  - ${MOBILE_DEV_HOST_DATA_ROOT:-/tmp/sparky-mobile-dev}/go-cache:/home/app/.cache/go-build
  - ${MOBILE_DEV_HOST_DATA_ROOT:-/tmp/sparky-mobile-dev}/python-local:/home/app/.local
  - ${MOBILE_DEV_HOST_DATA_ROOT:-/tmp/sparky-mobile-dev}/pip-cache:/home/app/.cache/pip
  - ${MOBILE_DEV_HOST_DATA_ROOT:-/tmp/sparky-mobile-dev}/uv-cache:/home/app/.cache/uv
  - ${HOST_SSH_AUTH_SOCK:-/run/user/0/gcr/ssh}:/ssh-agent
  - ${MOBILE_DEV_HOST_DATA_ROOT:-/tmp/sparky-mobile-dev}/projects:/projects

services:
  sparky-web-mobile-dev:
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
      extra_hosts:
        - "host.docker.internal=host-gateway"
      args: *build-args
    image: sp-mobile-dev-web:latest
    container_name: sp-mobile-dev-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:${MOBILE_DEV_WEB_PORT:-3006}:80"
    environment:
      SERVER_UPSTREAM: http://sp-mobile-dev-server:3001

  sparky-server-mobile-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runtime
      network: host
      extra_hosts:
        - "host.docker.internal=host-gateway"
      args: *build-args
    image: sp-mobile-dev-server:latest
    container_name: sp-mobile-dev-server
    restart: unless-stopped
    ports:
      - "0.0.0.0:${MOBILE_DEV_SERVER_PORT:-3301}:3001"
    environment:
      <<: *runtime-env
      PORT: "3001"
      EXECUTOR_BASE_URL: http://sp-mobile-dev-executor:3002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *server-volumes

  sparky-executor-mobile-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: executor-runtime
      network: host
      extra_hosts:
        - "host.docker.internal=host-gateway"
      args: *build-args
    image: sp-mobile-dev-executor:latest
    container_name: sp-mobile-dev-executor
    restart: unless-stopped
    ports:
      - "0.0.0.0:${MOBILE_DEV_EXECUTOR_PORT:-3302}:3002"
    environment:
      <<: *runtime-env
      EXECUTOR_PORT: "3002"
      PORT: "3001"
      GOCACHE: /home/app/.cache/go-build
      GOMODCACHE: /home/app/go/pkg/mod
      PIP_CACHE_DIR: /home/app/.cache/pip
      UV_CACHE_DIR: /home/app/.cache/uv
      PYTHONUSERBASE: /home/app/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes: *executor-volumes
